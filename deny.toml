# cargo-deny policy. Run `cargo deny check` before adding or bumping dependencies.
#
# The app is GPL-3.0-only (LICENSE, 2026-10-08). Dependencies stay permissive
# by policy anyway: it keeps the notices simple and the code reusable. A
# GPL-3.0-compatible copyleft crate is allowed only as a recorded exception.
# FFmpeg (LGPL) is not a crate; it is linked dynamically from third_party/ and
# covered by its own notice.

[graph]
# Windows first. Add Linux and macOS triples when their backends land.
targets = ["x86_64-pc-windows-msvc"]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # `paste` is unmaintained, not vulnerable: a compile-time macro used by rsmpeg.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro pulled in by rsmpeg; no runtime code" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    # Mozilla's root-certificate data (webpki-root-certs, via iroh's TLS).
    "CDLA-Permissive-2.0",
]
# Anything else (WTFPL, GPL, LGPL crates, ...) fails the check and needs a
# deliberate decision recorded here as an exception.
exceptions = [
    # egui's built-in fonts (Ubuntu-Light, Hack, Noto Emoji) for the viewer
    # HUD. Font licenses that allow bundling with software under any license;
    # their texts must ship with the installer's notices (M10).
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Our own crates are `publish = false`, GPL-3.0-only like the app; the allow
# list above is for dependencies.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
