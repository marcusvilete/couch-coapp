[workspace]
resolver = "3"
members = ["crates/*", "xtask", "apps/desktop/src-tauri"]

[workspace.package]
# The app's version, shown in the installer and to other members. Bump it
# with each installer handed out, together with tauri.conf.json's and
# apps/desktop/package.json's (scripts/build-installer.ps1 checks).
version = "0.17.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-only"
# Where the source is published: the notices and Settings → About link to it
# at the commit an installer was built from. A fork points this at its own.
repository = "https://github.com/marcusvilete/couch-coapp"

[workspace.dependencies]
# Internal crates
couch-proto = { path = "crates/couch-proto" }
couch-net = { path = "crates/couch-net" }
couch-room = { path = "crates/couch-room" }
couch-media = { path = "crates/couch-media" }
couch-codec-ffmpeg = { path = "crates/couch-codec-ffmpeg" }
couch-codec-opus = { path = "crates/couch-codec-opus" }
couch-input = { path = "crates/couch-input" }
couch-gamepad = { path = "crates/couch-gamepad" }
couch-platform-win = { path = "crates/couch-platform-win" }
couch-engine = { path = "crates/couch-engine" }
couch-testkit = { path = "crates/couch-testkit" }

# Networking. iroh is pinned exactly: the media framing depends on its stream and path APIs.
iroh = "=1.3.0"
# The relay server we deploy (M7): always iroh's own release.
iroh-relay = "=1.3.0"
iroh-tickets = "1.0"

# Media and platform. sdl3 is pinned exactly because its releases churn.
rsmpeg = "0.18"
# Builds libopus (BSD-3-Clause) from source with CMake. FFmpeg's wrapper
# can't do packet-loss concealment.
opus = "0.4"
sdl3 = "=0.20.0"
windows = "0.62"
windows-core = "0.62"
vigem-rust = "0.2"

# Viewer rendering
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false }
pollster = "1"
wgpu = "30"
# wgpu's own shader compiler, for the stream window's shader tests: keep it
# on wgpu's major version.
naga = { version = "30", features = ["wgsl-in"] }

# App shell
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-deep-link = "2.6"
# The save and open dialogs for a profile's backup (M13).
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

# General
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.11"
dirs = "6"
getrandom = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
proptest = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# Cryptography (RustCrypto and dalek). ed25519-dalek and curve25519-dalek are
# the versions iroh uses; spake2 is a pre-release because 0.4 still needs
# curve25519-dalek 4 and sha2 0.10 (docs/protocol.md, Admission).
ed25519-dalek = "3"
hkdf = "0.13"
hmac = "0.13"
# A profile's backup (M13): its key from the passphrase, and the sealing.
argon2 = "0.6"
chacha20poly1305 = "0.11"
zeroize = "1"
sha2 = "0.11"
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
unicode-normalization = "0.1"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Release keeps line tables so latency profiles stay readable.
[profile.release]
debug = "line-tables-only"

# Distribution builds (M10 packaging).
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
debug = false
