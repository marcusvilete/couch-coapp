[package]
name = "couch-gamepad"
description = "Physical gamepads through SDL3: their state in XInput's terms, and the host's own controller read on a thread of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
couch-input.workspace = true
couch-proto.workspace = true
sdl3.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Where a controller comes from: physical, or a virtual pad (P9).
couch-platform-win.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# SDL 3.4.16 built from source and linked in, as Windows' prebuilt one is
# pinned (ADR 0011).
sdl3 = { workspace = true, features = ["build-from-source-static"] }

[lints]
workspace = true
