[package]
name = "couch-codec-nvenc"
description = "The only crate that calls NVENC directly (M12d): H.264 and HEVC from the capture's D3D11 textures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Tests that need an NVIDIA GPU (NVENC).
gpu-tests = []

[dependencies]
bytes.workspace = true
couch-media.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
libloading.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# GPU frames and a decoder for the gpu-tests; never normal dependencies.
couch-platform-win.workspace = true
couch-codec-ffmpeg.workspace = true

[lints]
workspace = true
