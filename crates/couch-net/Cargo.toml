[package]
name = "couch-net"
description = "iroh endpoint, identity, invites, admission, mesh and media channels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A UDP transport that impairs traffic (delay, loss, bandwidth cap, blackouts)
# for testing rate control on one machine. Uses iroh's unstable custom-transport
# API, so it is for test tools only, never the app.
netem = ["iroh/unstable-custom-transports", "dep:iroh-base", "dep:n0-watcher", "dep:noq-udp"]

[dependencies]
bytes.workspace = true
couch-input.workspace = true
couch-media.workspace = true
couch-proto.workspace = true
hkdf.workspace = true
hmac.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
sha2.workspace = true
spake2.workspace = true
unicode-normalization.workspace = true
# Exactly iroh's versions: these name types in iroh's API.
noq-proto = "=1.3.0"
iroh-base = { version = "=1.3.0", optional = true }
n0-watcher = { version = "=1.0.0", optional = true }
noq-udp = { version = "=1.3.0", optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Timing tests need Windows' 1 ms timer resolution.
[target.'cfg(windows)'.dev-dependencies]
couch-platform-win.workspace = true

[lints]
workspace = true
