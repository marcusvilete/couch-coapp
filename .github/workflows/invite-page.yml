# Publishes the project's site on GitHub Pages, at https://<owner>.github.io/<repository>/:
# the landing page (deploy/landing-page) at its root and the invite page
# (deploy/invite-page, P4) at j/, put together by deploy/build-site.mjs. Only the pages'
# own files go out.
#
# Once per repository: Settings -> Pages -> Source: "GitHub Actions". Then it
# runs on every push to main that changes either page, or by hand (Actions ->
# Site -> Run workflow).

name: Site

on:
  push:
    branches: [main]
    paths:
      - deploy/invite-page/**
      - deploy/landing-page/**
      - deploy/build-site.mjs
      - .github/workflows/invite-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the one in progress.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The invite page's reading of an invite the app made (couch_proto's pinned ones).
      - name: Check the invite page
        run: node deploy/invite-page/check.js
      # Both pages, the repository written in: whose releases the downloads open and, on
      # the landing page, whose source its links show. It fails on a missing file.
      - name: Put the site together
        run: node deploy/build-site.mjs site "$GITHUB_REPOSITORY"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
