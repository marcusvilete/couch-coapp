# cargo-about: the Rust crates' licence texts for THIRD-PARTY-NOTICES.txt
# (`cargo xtask notices`, M10b). Keep `accepted` in step with deny.toml's
# allow list: cargo-deny decides what may be used, cargo-about only collects
# the texts. The order is the preference when a crate offers a choice
# (e.g. "MIT OR Apache-2.0" is shown as MIT).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# What ships: Windows, and only what the binaries link.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crates are GPL-3.0-only, covered by LICENSE.
private = { ignore = true }

# Crates whose licence files need cargo-about's built-in clarifications.
workarounds = ["ring", "rustls"]
